<script>
'use strict';
const $ = id => document.getElementById(id);
const tela = $('tela'), ctx = tela.getContext('2d');
const novo = (w, h) => Object.assign(document.createElement('canvas'), {width: w, height: h});
// marcadores ArUco 4x4 no alto de cada folha, em unidades da folha (424×300 = 280×198 mm); lado = quadrado preto
const QS = new URLSearchParams(location.search);
// o QR traz o mapa (?t=1,6 = lugares do percurso); a placa k (ids 3k..3k+2) só ancora o trecho k na parede
// ?l=N: local com blocos dourados na parede (1 marcador por bloco, ids base+k); o nível é contínuo e os blocos só localizam
const LOCAIS = {1: {nome: 'Corredor', t: [13, 14, 15, 16, 17]}}, nL = QS.get('l');
const LOCAL = LOCAIS[nL] ? {...LOCAIS[nL], base: 100 + 10 * (nL - 1)} : null;
const BU = BLOCO.mm * 424 / 280 / BLOCO.miolo.s;   // unidades da folha por px do bloco
const FOLHAS = LOCAL ? LOCAL.t.map(v => v - 1) : (QS.get('t') || '1,6').split(',').map(v => Math.max(1, Math.min(12, v | 0)) - 1).slice(0, 4);
const NF = FOLHAS.length, MARC = LOCAL                   // bloco centrado no alto de cada trecho
  ? {lado: BLOCO.miolo.s * BU, y: BLOCO.miolo.y * BU, xs: [212 - (BLOCO.w / 2 - BLOCO.miolo.x) * BU], ids: FOLHAS.map((_, k) => [LOCAL.base + k])}
  : {lado: 84, y: 10, xs: [10, 170, 330], ids: FOLHAS.map((_, k) => [3 * k, 3 * k + 1, 3 * k + 2])};
const CHEGADA = FOLHAS[NF - 1] === 11 ? {f: NF - 1, x: 338, y: 204, w: 60, h: 48, arte: true} : {f: NF - 1, x: 380, y: 204, w: 32, h: 48};
const VAO0 = 150;                                  // vão presumido até a câmera ver as duas folhas juntas
// mundo = unidades da folha 1; grade de colisão com célula de 2 unidades
const C = 2, GX0 = -150, GY0 = -150, GW = Math.ceil((300 + NF * 424 + (LOCAL ? 0 : (NF - 1) * 300)) / C), GH = 300, N = GW * GH;
const LIVRE = 0, CHAO = 1, CORPO = 2, PERIGO = 3, UM = 4;   // UM = plataforma de um sentido
const fixo = new Uint8Array(N), masc = new Uint8Array(N);
const Ts = FOLHAS.map((_, k) => ({a: 0, x: k * (424 + (LOCAL ? 0 : VAO0)), y: 0, n: k ? 0 : 99}));   // âncora -> mundo (medida); n = quadros ligada a outra
const NT = LOCAL ? FOLHAS.map((_, k) => ({a: 0, x: k * 424, y: 0})) : Ts;   // trecho -> mundo: blocos = fixo e contínuo; placas = o medido
let rasterTs = null;
let ATLAS, MAPA, video = null, fonte = 'teste', maoIA = null, maoSegs = [], douradas = [];
let H = null, Hi = null, tVisto = -9, marcas = [], detMs = 0, nQuadro = 0;
const sprite = new Image(); sprite.src = 'be-spritesheet.png';
const P = {x: 0, y: 0, vx: 0, vy: 0, chao: false, coy: 0, cortou: true, olha: 1, anim: 'fall', q: 0, tq: 0, pouso: 0};
const salvo = {x: 0, y: 0, ok: false};
const teclas = {e: false, d: false, pulo: false, usado: false};
const est = {t0: 0, ativo: false, rastreio: false, quedas: 0, mortes: 0, chegou: false, invul: 0, fps: 0, ligado: false, res: 0};

// ---------- álgebra 3×3 ----------
const m3 = (a, b) => [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => { const r = i / 3 | 0, c = i % 3; return a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c]; });
function inv3(m) {
  const [a, b, c, d, e, f, g, h, i] = m, A = e * i - f * h, B = f * g - d * i, K = d * h - e * g, det = a * A + b * B + c * K;
  return [A, c * h - b * i, b * f - c * e, B, a * i - c * g, c * d - a * f, K, b * g - a * h, a * e - b * d].map(v => v / det);
}
const ap = (m, x, y) => { const w = m[6] * x + m[7] * y + m[8]; return {x: (m[0] * x + m[1] * y + m[2]) / w, y: (m[3] * x + m[4] * y + m[5]) / w}; };
function normaliza(p) {
  let cx = 0, cy = 0, d = 0;
  for (const q of p) { cx += q.x; cy += q.y; }
  cx /= p.length; cy /= p.length;
  for (const q of p) d += Math.hypot(q.x - cx, q.y - cy);
  const s = Math.SQRT2 / (d / p.length || 1);
  return [s, 0, -s * cx, 0, s, -s * cy, 0, 0, 1];
}
function resolve(M, v, n) {                        // Gauss com pivô parcial
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r * n + c]) > Math.abs(M[p * n + c])) p = r;
    if (Math.abs(M[p * n + c]) < 1e-12) return null;
    if (p !== c) { for (let k = 0; k < n; k++) [M[c * n + k], M[p * n + k]] = [M[p * n + k], M[c * n + k]]; [v[c], v[p]] = [v[p], v[c]]; }
    for (let r = c + 1; r < n; r++) {
      const f = M[r * n + c] / M[c * n + c];
      for (let k = c; k < n; k++) M[r * n + k] -= f * M[c * n + k];
      v[r] -= f * v[c];
    }
  }
  const x = new Array(n);
  for (let r = n - 1; r >= 0; r--) { let s = v[r]; for (let k = r + 1; k < n; k++) s -= M[r * n + k] * x[k]; x[r] = s / M[r * n + r]; }
  return x;
}
function homografia(src, dst) {                    // DLT normalizada por mínimos quadrados: src (mundo) -> dst (px)
  const Ta = normaliza(src), Tb = normaliza(dst), M = new Float64Array(64), v = new Float64Array(8);
  for (let i = 0; i < src.length; i++) {
    const a = ap(Ta, src[i].x, src[i].y), b = ap(Tb, dst[i].x, dst[i].y);
    for (const [r, t] of [[[a.x, a.y, 1, 0, 0, 0, -b.x * a.x, -b.x * a.y], b.x], [[0, 0, 0, a.x, a.y, 1, -b.y * a.x, -b.y * a.y], b.y]])
      for (let j = 0; j < 8; j++) { v[j] += r[j] * t; for (let k = 0; k < 8; k++) M[j * 8 + k] += r[j] * r[k]; }
  }
  const h = resolve(M, v, 8);
  if (!h) return null;
  const R = m3(inv3(Tb), m3([...h, 1], Ta));
  return R.map(x => x / R[8]);
}
function rigido(src, dst) {                        // dst ≈ rotação·src + translação
  let ax = 0, ay = 0, bx = 0, by = 0, sc = 0, ss = 0;
  for (let i = 0; i < src.length; i++) { ax += src[i].x; ay += src[i].y; bx += dst[i].x; by += dst[i].y; }
  ax /= src.length; ay /= src.length; bx /= src.length; by /= src.length;
  for (let i = 0; i < src.length; i++) {
    const px = src[i].x - ax, py = src[i].y - ay, qx = dst[i].x - bx, qy = dst[i].y - by;
    sc += px * qx + py * qy; ss += px * qy - py * qx;
  }
  const a = Math.atan2(ss, sc), c = Math.cos(a), s = Math.sin(a);
  return {a, x: bx - (c * ax - s * ay), y: by - (s * ax + c * ay)};
}
const gira = (T, x, y) => { const c = Math.cos(T.a), s = Math.sin(T.a); return {x: c * x - s * y + T.x, y: s * x + c * y + T.y}; };
const ancoraMundo = (f, x, y) => gira(Ts[f], x, y);
const folhaMundo = (f, x, y) => { const T = NT[f], c = Math.cos(T.a), s = Math.sin(T.a); return {x: c * x - s * y + T.x, y: s * x + c * y + T.y}; };
const mundoFolha = (f, x, y) => { const T = NT[f], c = Math.cos(T.a), s = Math.sin(T.a), dx = x - T.x, dy = y - T.y; return {x: c * dx + s * dy, y: -s * dx + c * dy}; };
const ONDE = new Map(MARC.ids.flatMap((l, f) => l.map((id, j) => [id, {f, j}])));
function cantosMarca(id) {                         // cantos do quadrado preto em unidades da folha, horário a partir do topo-esquerdo
  const {f, j} = ONDE.get(id), x = MARC.xs[j], y = MARC.y, L = MARC.lado;
  return {f, p: [{x, y}, {x: x + L, y}, {x: x + L, y: y + L}, {x, y: y + L}]};
}

// ---------- detecção dos marcadores na resolução da câmera ----------
const detector = new AR.Detector({dictionaryName: 'ARUCO_4X4_1000', maxHammingDistance: 0});
const VALIDOS = new Set(MARC.ids.flat());
const dcan = novo(2, 2), dctx = dcan.getContext('2d', {willReadFrequently: true});
function detecta(F, t) {
  const perdido = t - tVisto > .5, longo = perdido && nQuadro & 1 ? 1600 : 960;   // perdido: alterna com resolução maior (folha longe)
  const f = Math.min(1, longo / Math.max(F.w, F.h)), w = Math.round(F.w * f), h = Math.round(F.h * f);
  if (dcan.width !== w || dcan.height !== h) { dcan.width = w; dcan.height = h; }
  dctx.drawImage(F.img, 0, 0, w, h);
  const t0 = performance.now(), ms = detector.detect(dctx.getImageData(0, 0, w, h));
  detMs = detMs * .8 + (performance.now() - t0) * .2;
  const porId = new Map();
  for (const m of ms) if (VALIDOS.has(m.id)) {
    const c = m.corners.map(p => ({x: p.x / f, y: p.y / f})), area = Math.abs((c[2].x - c[0].x) * (c[3].y - c[1].y) - (c[3].x - c[1].x) * (c[2].y - c[0].y));
    if (!porId.has(m.id) || porId.get(m.id).area < area) porId.set(m.id, {id: m.id, c, area});
  }
  marcas = [...porId.values()];
}

// ---------- pose: homografia mundo -> px do vídeo ----------
function afim(src, dst) {                          // afim por mínimos quadrados: 1 marcador pequeno não sustenta a perspectiva de longe
  const M = [0, 0, 0, 0, 0, 0, 0, 0, 0], bx = [0, 0, 0], by = [0, 0, 0];
  src.forEach((p, i) => { const v = [p.x, p.y, 1]; for (let r = 0; r < 3; r++) { for (let c = 0; c < 3; c++) M[r * 3 + c] += v[r] * v[c]; bx[r] += v[r] * dst[i].x; by[r] += v[r] * dst[i].y; } });
  const I = inv3(M), sol = b => [0, 1, 2].map(r => I[r * 3] * b[0] + I[r * 3 + 1] * b[1] + I[r * 3 + 2] * b[2]);
  return [...sol(bx), ...sol(by), 0, 0, 1];
}
function liga() {                                  // placas no mesmo quadro: mede vão e giro reais a partir de uma já ligada
  const por = FOLHAS.map(() => []);
  for (const m of marcas) { const k = cantosMarca(m.id); por[k.f].push({m, k}); }
  const vis = por.map((o, f) => o.length ? f : -1).filter(f => f >= 0), ref = vis.find(f => !f || Ts[f].n >= 4);
  if (vis.length < 2 || ref === undefined) return;
  const HA = (LOCAL ? afim : homografia)(por[ref].flatMap(o => o.k.p), por[ref].flatMap(o => o.m.c));
  if (!HA) return;
  const HAi = inv3(HA), R0 = Ts[ref], c0 = Math.cos(R0.a), s0 = Math.sin(R0.a);
  for (const f of vis) if (f && f !== ref) {
    const src = por[f].flatMap(o => o.k.p), dst = por[f].flatMap(o => o.m.c.map(p => ap(HAi, p.x, p.y)));
    const r = rigido(src, dst), c = Math.cos(r.a), s = Math.sin(r.a);
    let e = 0;
    for (let i = 0; i < src.length; i++) e += Math.hypot(c * src[i].x - s * src[i].y + r.x - dst[i].x, s * src[i].x + c * src[i].y + r.y - dst[i].y);
    est.res = e / src.length;
    if (est.res > 8 || Math.abs(r.a) > .5) continue;   // leitura ruim (placa muito oblíqua): ignora
    const T = Ts[f], al = T.n < 4 ? .5 : .08, ax = R0.a + r.a, x = c0 * r.x - s0 * r.y + R0.x, y = s0 * r.x + c0 * r.y + R0.y;
    T.a += (ax - T.a) * al; T.x += (x - T.x) * al; T.y += (y - T.y) * al; T.n++;
  }
  est.ligado = Ts.every(T => T.n >= 4);
}
function pose(t) {
  if (!marcas.length) { est.rastreio = t - tVisto < .4; return; }
  liga();
  const src = [], dst = [];
  for (const m of marcas) { const k = cantosMarca(m.id); k.p.forEach((p, i) => { src.push(ancoraMundo(k.f, p.x, p.y)); dst.push(m.c[i]); }); }
  const Hr = homografia(src, dst);
  if (!Hr) return;
  if (!H || t - tVisto > .4) H = Hr;
  else {                                           // suaviza tremor; movimento grande passa direto
    let cx = 0, cy = 0;
    for (const p of src) { cx += p.x; cy += p.y; }
    const a0 = ap(H, cx / src.length, cy / src.length), a1 = ap(Hr, cx / src.length, cy / src.length);
    const al = Math.min(1, .35 + Math.hypot(a1.x - a0.x, a1.y - a0.y) / 12);
    H = H.map((v, i) => v + (Hr[i] - v) * al);
  }
  Hi = inv3(H); tVisto = t; est.rastreio = true;
  if (!est.ativo) {                                // primeira vez: Bê nasce no início da folha vista
    const f = LOCAL ? 0 : Math.min(...marcas.map(m => cantosMarca(m.id).f)), sp = MAPA.folhas[FOLHAS[f]].spawn, w = folhaMundo(f, sp.x, sp.y);
    Object.assign(salvo, {x: (w.x - GX0) / C, y: (w.y - GY0) / C, ok: true});
    est.ativo = true; est.t0 = t; renasce();
  }
}

// ---------- colisão do mapa (impresso) no mundo ----------
function retangulo(f, x, y, w, h, tp) {
  const cs = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(([a, b]) => folhaMundo(f, a, b));
  const x0 = Math.max(0, Math.floor((Math.min(...cs.map(p => p.x)) - GX0) / C)), x1 = Math.min(GW - 1, Math.ceil((Math.max(...cs.map(p => p.x)) - GX0) / C));
  const y0 = Math.max(0, Math.floor((Math.min(...cs.map(p => p.y)) - GY0) / C)), y1 = Math.min(GH - 1, Math.ceil((Math.max(...cs.map(p => p.y)) - GY0) / C));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
    const q = mundoFolha(f, GX0 + (gx + .5) * C, GY0 + (gy + .5) * C);
    if (q.x >= x && q.x < x + w && q.y >= y && q.y < y + h) fixo[gy * GW + gx] = tp;
  }
}
function rasteriza() {
  fixo.fill(LIVRE);
  FOLHAS.forEach((n, f) => {
    const F = MAPA.folhas[n];
    for (const p of F.plataformas) retangulo(f, p.x, p.y, p.w, Math.min(p.h, 300 - p.y), p.umSentido ? UM : CHAO);
    for (const z of F.zonasMorte) retangulo(f, z.x, z.y, z.w, 300 - z.y, PERIGO);
  });
  rasterTs = Ts.map(T => ({...T}));
}
const mudouTs = () => !rasterTs || !LOCAL && Ts.some((T, i) => Math.hypot(T.x - rasterTs[i].x, T.y - rasterTs[i].y) > .5 || Math.abs(T.a - rasterTs[i].a) > .002);

// ---------- mão: segmentos em px do vídeo viram cápsulas CORPO no mundo ----------
const OSSOS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17],[1,5],[0,9],[0,13]];
async function carregaMaoIA() {
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const v = await import(V + '/vision_bundle.mjs');
  const fs = await v.FilesetResolver.forVisionTasks(V + '/wasm');
  maoIA = await v.HandLandmarker.createFromOptions(fs, {
    baseOptions: {modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU'},
    runningMode: 'VIDEO', numHands: 2});
}
function segmentosMao() {
  if ($('corpo').value === 'off') return [];
  if (fonte === 'teste') return $('mao').checked ? maoTeste() : [];
  if (!maoIA || !video || video.readyState < 2) return [];
  const vw = video.videoWidth, vh = video.videoHeight, segs = [];
  for (const m of maoIA.detectForVideo(video, performance.now()).landmarks) {
    const p = m.map(l => ({x: l.x * vw, y: l.y * vh})), r = Math.hypot(p[0].x - p[9].x, p[0].y - p[9].y) * .2;
    for (const [a, b] of OSSOS) segs.push({a: p[a], b: p[b], r});
  }
  return segs;
}
function carimbaMao() {
  if (!Hi) return;
  const grade = p => { const w = ap(Hi, p.x, p.y); return {x: (w.x - GX0) / C, y: (w.y - GY0) / C}; };
  for (const s of maoSegs) {
    const a = grade(s.a), b = grade(s.b), r = Math.max(1, Math.hypot(...Object.values(grade({x: s.a.x, y: s.a.y + s.r})).map((v, i) => v - [a.x, a.y][i])));
    if (![a.x, a.y, b.x, b.y, r].every(Number.isFinite) || r > 60 || Math.hypot(b.x - a.x, b.y - a.y) > GW) continue;
    const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y)) + 1;
    for (let k = 0; k <= n; k++) {
      const cx = a.x + (b.x - a.x) * k / n, cy = a.y + (b.y - a.y) * k / n;
      for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(GH - 1, cy + r); y++)
        for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(GW - 1, cx + r); x++)
          if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r && masc[y * GW + x] !== CHAO) masc[y * GW + x] = CORPO;
    }
  }
}

// ---------- física (números do jogo, em células de 2 unidades) ----------
const tipo = (x, y) => { x = Math.floor(x); y = Math.floor(y); return x >= 0 && x < GW && y >= 0 && y < GH ? masc[y * GW + x] : LIVRE; };
const sol = (x, y) => { const t = tipo(x, y); return t === CHAO || t === CORPO; };
const apoio = (x, y) => { const t = tipo(x, y); return t === UM ? tipo(x, y - 1) !== UM : t === CHAO || t === CORPO; };   // um sentido: só a face de cima
function linha(r, x0, x1, f = sol) { for (let x = Math.floor(x0); x <= Math.floor(x1); x++) if (f(x, r)) return true; return false; }
function pisaImpresso(r, x0, x1) { for (let x = Math.floor(x0); x <= Math.floor(x1); x++) { const t = tipo(x, r); if (t === CHAO || t === UM) return true; } return false; }
function renasce() { Object.assign(P, {x: salvo.x, y: salvo.y - 1, vx: 0, vy: 0, chao: false}); est.invul = .6; }
function gatilhos(S, hw) {

    ctx.setTransform(ex.x * P.olha, ex.y * P.olha, ey.x, ey.y, p0.x, p0.y);   // segue escala, giro e inclinação da parede
    ctx.drawImage(sprite, fr.x, fr.y, fr.w, fr.h, -ATLAS.anchor.x, -ATLAS.anchor.y, fr.w, fr.h);
    ctx.restore();
  }
  $('info').textContent =
    `fps ${est.fps.toFixed(0)}  det ${detMs.toFixed(0)} ms  vídeo ${F.w}×${F.h}\n` +
    `marcas [${marcas.map(m => m.id).sort().join(',')}]  ${NF < 2 ? '' : est.ligado ? `ligado vão ${Ts.slice(1).map((T, k) => (T.x - Ts[k].x - 424).toFixed(0)).join('/')} giro ${(Ts[NF - 1].a * 57.3).toFixed(1)}°` : 'placas no vão presumido'}\n` +
    `douradas ${douradas.filter(d => d.pega).length}/${douradas.length}  quedas ${est.quedas}  mortes ${est.mortes}${est.chegou ? '  CHEGOU' : ''}`;
}

// ---------- laço ----------
let vista = {k: 1, ox: 0, oy: 0};
function fonteAtual() {
  if (fonte === 'cam') return video && video.readyState >= 2 ? {img: video, w: video.videoWidth, h: video.videoHeight} : null;
  return {img: quadro, w: FW, h: FH};
}
function passo(dt, t) {
  nQuadro++;
  if (fonte === 'teste') geraQuadro(t);
  const F = fonteAtual();
  if (!F) { tela.width = tela.width; return; }
  if (detMs < 35 || nQuadro & 1 || !est.rastreio) { detecta(F, t); pose(t); }   // celular lento: detecta um quadro sim, outro não
  if (mudouTs()) rasteriza();
  masc.set(fixo); maoSegs = segmentosMao(); carimbaMao();
  fisica(dt); desenha(F, t);
}
let tAnt = performance.now();
function laco(now) {
  const dt = Math.min(.05, (now - tAnt) / 1000); tAnt = now;
  est.fps = est.fps * .9 + (dt > 0 ? .1 / dt : 0);
  passo(dt, now / 1000);
  requestAnimationFrame(laco);
}

// ---------- entrada ----------
let arr = null;
tela.onpointerdown = e => { arr = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, mov: false}; tela.setPointerCapture(e.pointerId); };
tela.onpointermove = e => {
  if (!arr) return;
  const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
  if (Math.hypot(dx, dy) > 6) arr.mov = true;
  if (arr.mov && fonte === 'teste') { const f = devicePixelRatio / vista.k / cam.z; cam.bx = cam.x = arr.cx - dx * f; cam.by = cam.y = arr.cy - dy * f; }
};
tela.onpointerup = e => {
  if (arr && !arr.mov && Hi && est.rastreio) {     // toque: solta o Bê ali (depuração)
    const v = {x: (e.clientX * devicePixelRatio - vista.ox) / vista.k, y: (e.clientY * devicePixelRatio - vista.oy) / vista.k}, w = ap(Hi, v.x, v.y);
    Object.assign(P, {x: (w.x - GX0) / C, y: (w.y - GY0) / C, vx: 0, vy: 0, chao: false}); est.chegou = false;
  }
  arr = null;
};
$('hud').querySelector('b').onclick = () => $('hud').classList.toggle('min');
const mapaTecla = {ArrowLeft: 'e', KeyA: 'e', ArrowRight: 'd', KeyD: 'd', Space: 'pulo', ArrowUp: 'pulo', KeyW: 'pulo'};
addEventListener('keydown', e => { const t = mapaTecla[e.code]; if (t) { teclas[t] = true; e.preventDefault(); } });
addEventListener('keyup', e => { const t = mapaTecla[e.code]; if (t) { teclas[t] = false; if (t === 'pulo') teclas.usado = false; } });
for (const [id, t] of [['bE', 'e'], ['bD', 'd'], ['bP', 'pulo']]) {
  const b = $(id);
  b.onpointerdown = e => { teclas[t] = true; b.setPointerCapture(e.pointerId); };
  b.onpointerup = b.onpointercancel = () => { teclas[t] = false; if (t === 'pulo') teclas.usado = false; };
}
$('vao').oninput = $('mao').onchange = () => desenhaCena();
$('fonte').onchange = async () => {
  fonte = $('fonte').value; H = Hi = null; tVisto = -9;
  document.body.classList.toggle('cam', fonte === 'cam');
  if (fonte === 'cam' && !video) {
    try {
      const st = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false});
      const tr = st.getVideoTracks()[0];
      tr.applyConstraints({advanced: [{focusMode: 'continuous'}]}).catch(() => {});
      video = Object.assign(document.createElement('video'), {playsInline: true, muted: true, srcObject: st});
      await video.play();
    } catch (err) { alert('Câmera indisponível: ' + err.message + '\n(no celular precisa de https)'); }
    if ($('corpo').value === 'ia' && !maoIA) carregaMaoIA().catch(err => { console.warn('mão IA', err); $('corpo').value = 'off'; });
  }
};

Promise.all([
  fetch('be-atlas.json').then(r => r.json()),
  fetch('jornada-mapa.json').then(r => r.json()),
  sprite.decode(), dourImg.decode(), ...artes.map(im => im.decode()),
  ...MARC.ids.flat().map((id, k) => { const im = new Image(); im.src = 'data:image/svg+xml,' + encodeURIComponent(LOCAL ? blocoSVG(detector.dictionary, id, k + 1) : detector.dictionary.generateSVG(id)); marcaImg[id] = im; return im.decode(); }),
]).then(([a, m]) => {
  ATLAS = a; MAPA = m; glPrepara();
  douradas = FOLHAS.flatMap((n, f) => MAPA.folhas[n].douradas.map(d => ({f, x: d.x, y: d.y, pega: false, t: 0})));
  desenhaCena();
  const B = folhaB();
  if (LOCAL) $('zoom').value = 100;               // celular a ~60 cm da parede
  cam.bx = cam.x = LOCAL ? FA.x + 300 * K : (FA.x + B.x + 424 * K) / 2; cam.by = cam.y = FA.y + 150 * K;
  window.__J = {NF, FOLHAS, LOCAL, NT, blocoCena, glOk: () => !!glp, P, est, cam, Ts, teclas, douradas, passo, desenhaCena, cenaQuadro, folhaB, FA, K, ROT_B, GX0, GY0, C,
    H: () => H, marcas: () => marcas, tipo: (wx, wy) => tipo((wx - GX0) / C, (wy - GY0) / C)};
  const q = QS;
  if (q.has('cam')) { $('fonte').value = 'cam'; $('fonte').onchange(); $('hud').classList.add('min'); }
  if (!q.has('pausa')) requestAnimationFrame(laco);
});
